name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME:-v$cargo_version}"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then tag="v$cargo_version"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}

      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libssl-dev pkg-config cmake perl

      - name: Set up NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile release binary
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="zapfast-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zapfast.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/zapfast" "dist/$name/"
          fi
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zapfast-portable.txt "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp --parents packaging/applications/zapfast.desktop packaging/icons/zapfast.svg contrib/omarchy/zapfast.json.tpl contrib/omarchy/zapfast-theme "dist/$name/"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - name: Windows Installer (Inno Setup)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION"
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $numericVersion = $version.Split("-")[0]
          & $iscc "/DVersion=$version" "/DNumericVersion=$numericVersion" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\zapfast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\zapfast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: warn

  macos:
    name: macOS universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME:-v$cargo_version}"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then tag="v$cargo_version"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build macOS binary
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          if cargo build --locked --release --target x86_64-apple-darwin; then
            mkdir -p universal
            lipo -create \
              target/aarch64-apple-darwin/release/zapfast \
              target/x86_64-apple-darwin/release/zapfast \
              -output universal/zapfast
          else
            echo "x86_64 build failed, packaging native aarch64 binary"
            mkdir -p universal
            cp target/aarch64-apple-darwin/release/zapfast universal/zapfast
          fi
          rm -rf target

      - name: App bundle
        run: |
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/zapfast dist/macos-input/ZapFast.app "$RELEASE_VERSION"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/macos-input/

      - name: Package DMG and Zip
        run: |
          name="zapfast-${RELEASE_TAG}-macos"
          cd dist
          zip -r -y "${name}.zip" macos-input/ZapFast.app macos-input/README.md macos-input/LICENSE
          
          mkdir -p dmg-pack
          cp -R macos-input/ZapFast.app dmg-pack/
          ln -s /Applications dmg-pack/Applications
          cp macos-input/README.md macos-input/LICENSE dmg-pack/
          hdiutil create -volname "ZapFast" -srcfolder dmg-pack -ov -format UDZO "${name}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  publish:
    name: GitHub release
    needs: [build, macos]
    if: always() && !cancelled() && (needs.build.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME:-v$cargo_version}"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then tag="v$cargo_version"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare Release Notes
        shell: bash
        run: |
          notes="packaging/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            echo "# ZapFast (Calls & Extended Edition)" > release-notes.md
            echo "" >> release-notes.md
            echo "Versi fork dari ZapFast dengan dukungan penuh fitur-fitur WhatsApp modern:" >> release-notes.md
            echo "" >> release-notes.md
            echo "### ✨ Fitur Baru & Peningkatan:" >> release-notes.md
            echo "- 📞 Voice & Video Calls: Panggilan suara & video call native WebRTC 30 FPS" >> release-notes.md
            echo "- 📋 Call History: Halaman log panggilan terjawab & missed call" >> release-notes.md
            echo "- 🌟 Starred Messages: Tandai pesan penting dengan bintang" >> release-notes.md
            echo "- 📌 Pinned Messages: Sematkan pesan di bagian atas chat" >> release-notes.md
            echo "- 🎬 Status Video: Audio story (AAC) jernih + tombol hapus status sendiri" >> release-notes.md
            echo "- ✨ Animated Stickers: Pemutaran stiker animasi terus-menerus" >> release-notes.md
            echo "- 🚫 Block & Unblock: Kelola pemblokiran kontak langsung dari aplikasi" >> release-notes.md
            echo "- ⏳ Disappearing Messages: Pengaturan durasi pesan sementara" >> release-notes.md
            echo "- 🎨 Modern WhatsApp Web UI: Sidebar rail terintegrasi & filter unread/missed" >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: ZapFast Extended ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
