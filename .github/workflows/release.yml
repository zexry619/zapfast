name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  linux:
    name: build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME:-v$cargo_version}"
          if [ -z "$tag" ] || [ "$tag" = "null" ] || [ "$tag" = "main" ]; then tag="v$cargo_version-calls"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: rustup target add x86_64-unknown-linux-gnu

      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libssl-dev pkg-config cmake perl nasm

      - name: Compile release binary
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package
        shell: bash
        run: |
          name="zapfast-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp "target/x86_64-unknown-linux-gnu/release/zapfast" "dist/$name/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zapfast-portable.txt "dist/$name/"
          cp --parents packaging/applications/zapfast.desktop packaging/icons/zapfast.svg contrib/omarchy/zapfast.json.tpl contrib/omarchy/zapfast-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME -ne "main") { $env:GITHUB_REF_NAME } else { "v$cargoVersion-calls" }
          $version = $tag.TrimStart("v")
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc

      - name: Set up NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --confirm --no-progress

      - name: Compile release binary
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Windows cargo build failed with exit code $LASTEXITCODE. Showing last 150 lines of log:"
            Get-Content build-windows.log -Tail 150
            exit $LASTEXITCODE
          }

      - name: Package
        shell: pwsh
        run: |
          $name = "zapfast-${env:RELEASE_TAG}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist\$name"
          Copy-Item "target\x86_64-pc-windows-msvc\release\zapfast.exe" "dist\$name\"
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md, packaging\zapfast-portable.txt "dist\$name\"
          7z a "dist\$name.zip" "dist\$name"

      - name: Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION"
          $numericVersion = $version.Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (Test-Path $iscc) {
            & $iscc "/DVersion=$version" "/DNumericVersion=$numericVersion" "/DArch=x86_64" `
              "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\zapfast.exe" `
              "/DOutputDir=$PWD\dist" packaging\windows\zapfast.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning "ISCC.exe not found, skipping installer creation."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows
          path: build-windows.log
          if-no-files-found: ignore

  macos:
    name: build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME:-v$cargo_version}"
          if [ -z "$tag" ] || [ "$tag" = "null" ] || [ "$tag" = "main" ]; then tag="v$cargo_version-calls"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up NASM
        uses: ilammy/setup-nasm@v1

      - name: Build macOS binary
        shell: bash
        run: |
          set -o pipefail
          mkdir -p universal
          echo "Building Apple Silicon (aarch64) release..."
          if ! cargo build --locked --release --target aarch64-apple-darwin 2>&1 | tee build-macos.log; then
            echo "::error::macOS aarch64 cargo build failed! Showing last 150 lines of log:"
            tail -n 150 build-macos.log
            exit 1
          fi
          cp target/aarch64-apple-darwin/release/zapfast universal/zapfast

          echo "Attempting Intel (x86_64) release for universal binary..."
          if cargo build --locked --release --target x86_64-apple-darwin 2>&1 | tee build-macos-intel.log; then
            echo "Both architectures built successfully. Creating universal binary via lipo..."
            lipo -create \
              target/aarch64-apple-darwin/release/zapfast \
              target/x86_64-apple-darwin/release/zapfast \
              -output universal/zapfast
          else
            echo "x86_64 build not available, proceeding with native aarch64 binary"
          fi

      - name: App bundle
        shell: bash
        run: |
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/zapfast dist/macos-input/ZapFast.app "$RELEASE_VERSION"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/macos-input/

      - name: Package DMG and Zip
        shell: bash
        run: |
          name="zapfast-${RELEASE_TAG}-macos"
          cd dist
          zip -r -y "${name}.zip" macos-input/ZapFast.app macos-input/README.md macos-input/LICENSE
          
          mkdir -p dmg-pack
          cp -R macos-input/ZapFast.app dmg-pack/
          ln -s /Applications dmg-pack/Applications
          cp macos-input/README.md macos-input/LICENSE dmg-pack/
          hdiutil create -volname "ZapFast" -srcfolder dmg-pack -ov -format UDZO "${name}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-macos
          path: build-macos*.log
          if-no-files-found: ignore

  publish:
    name: GitHub release
    needs: [linux, windows, macos]
    if: always() && !cancelled() && (needs.linux.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME:-v$cargo_version}"
          if [ -z "$tag" ] || [ "$tag" = "null" ] || [ "$tag" = "main" ]; then tag="v$cargo_version-calls"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: dist
          merge-multiple: true

      - name: List downloaded release assets
        shell: bash
        run: |
          ls -la dist/

      - name: Prepare Release Notes
        shell: bash
        run: |
          notes="packaging/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            echo "Notes not found at $notes, creating fallback notes"
            echo "# ZapFast Extended \${RELEASE_TAG}" > release-notes.md
            echo "Dukungan penuh Voice & Video Calls WebRTC dan fitur WhatsApp modern." >> release-notes.md
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: ZapFast Extended ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true

      - name: Ensure all assets are uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/* --clobber || true
